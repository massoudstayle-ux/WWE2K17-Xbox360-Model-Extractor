name: Analyze WWE 2K17 PAC

# Re-run extraction and the rigged-FBX prototype when this workflow changes.

on:
  push:
    paths:
      - 'ch120.pac'
      - 'ch139.pac'
      - 'tools/pac_probe.py'
      - 'tools/pac_analyze.py'
      - 'tools/scan_decompressed.py'
      - 'tools/decode_yuke_bpe.py'
      - 'tools/export_jboy_obj.py'
      - 'tools/extract_jboy_models.py'
      - 'tools/audit_jboy_material_links.py'
      - 'tools/analyze_jboy_skinning.py'
      - 'tools/blender_export_jboy_fbx.py'
      - 'tools/merge_accessory_fbx.py'
      - 'tools/render_fbx_previews.py'
      - '.github/workflows/render-existing-fbx.yml'
      - 'tools/validate_jboy_bone_hierarchy.py'
      - 'tools/inspect_jboy_bone_fields.py'
      - 'tools/map_jboy_bones.py'
      - 'tools/bone_transform_diagnostics.py'
      - 'tests/test_bone_transform_diagnostics.py'
      - 'tests/test_map_jboy_bones.py'
      - 'tests/test_inspect_jboy_bone_fields.py'
      - 'tests/test_decode_yuke_bpe.py'
      - 'tests/test_export_jboy_obj.py'
      - 'tools/parse_hspc.py'
      - 'tools/extract_texture_resources.py'
      - 'tools/decode_bpe_texture_resources.py'
      - 'tools/build_dds_contact_sheet.py'
      - 'tests/test_parse_hspc.py'
      - 'tests/test_scan_decompressed.py'
      - 'tools/inspect_xcompress.py'
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/analyze-pac.yml'
  workflow_dispatch:
    inputs:
      target_file:
        description: "PAC file in the repository"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  pac-probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify input file
        env:
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          if [ -n "$TARGET_FILE" ]; then
            test -f "$TARGET_FILE" || { echo "PAC file not found: $TARGET_FILE"; exit 1; }
            echo "$TARGET_FILE" > analysis-targets.txt
          else
            : > analysis-targets.txt
            for file in ch120.pac ch139.pac; do
              if [ -f "$file" ]; then echo "$file" >> analysis-targets.txt; fi
            done
          fi
          test -s analysis-targets.txt || { echo "No target PAC files found"; exit 1; }
          while IFS= read -r file; do ls -lh "$file"; done < analysis-targets.txt

      - name: Build XMemCompression TD decoder
        run: |
          git clone --depth 1 https://github.com/PopGameTool/XMemCompression.git /tmp/XMemCompression
          cmake -S /tmp/XMemCompression -B /tmp/XMemCompression/build -A x64
          cmake --build /tmp/XMemCompression/build --config Release --parallel 2
          DECODER="$(find /tmp/XMemCompression/build -type f -iname XMemCompression.exe | head -n 1)"
          test -n "$DECODER" || { echo "XMemCompression executable not found after build"; exit 1; }
          echo "$DECODER" > /tmp/xmem-decoder-path.txt
          "$DECODER" 2>&1 | head -n 12 || true

      - name: Attempt XMem LZX TD decompression
        run: |
          DECODER="$(cat /tmp/xmem-decoder-path.txt)"
          mkdir -p analysis-output/decompressed
          while IFS= read -r PAC_FILE; do
            OUT="analysis-output/decompressed/$(basename "$PAC_FILE" .pac).decompressed.bin"
            echo "=== $PAC_FILE ===" | tee -a analysis-output/xmem-report.txt
            set +e
            timeout 180 "$DECODER" --decompress "$PAC_FILE" "$OUT" 2>&1 | tee -a analysis-output/xmem-report.txt
            RC=${PIPESTATUS[0]}
            set -e
            echo "Decoder exit code: $RC" | tee -a analysis-output/xmem-report.txt
            if [ -f "$OUT" ]; then
              ls -lh "$OUT" | tee -a analysis-output/xmem-report.txt
              od -An -tx1 -N32 "$OUT" | tee -a analysis-output/xmem-report.txt
            else
              echo "No output file created" | tee -a analysis-output/xmem-report.txt
            fi
          done < analysis-targets.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan XMem outputs for candidate model and texture signatures
        if: always()
        run: |
          mkdir -p analysis-output/signature-scan
          for file in analysis-output/decompressed/*.decompressed.bin; do
            [ -f "$file" ] || continue
            name="$(basename "$file" .decompressed.bin)"
            python tools/scan_decompressed.py "$file" --output "analysis-output/signature-scan/$name-signatures.txt"
          done

      - name: Parse HSPC and SHDC directory tables
        if: always()
        run: |
          mkdir -p analysis-output/container-parse
          for file in analysis-output/decompressed/*.decompressed.bin; do
            [ -f "$file" ] || continue
            name="$(basename "$file" .decompressed.bin)"
            python tools/parse_hspc.py "$file" --output "analysis-output/container-parse/$name-containers.json"
          done



      - name: Decode BPE resources and recover DDS texture candidates
        if: always()
        run: |
          mkdir -p analysis-output/bpe-textures
          for file in analysis-output/decompressed/*.decompressed.bin; do
            [ -f "$file" ] || continue
            python tools/decode_bpe_texture_resources.py "$file" --output-dir analysis-output/bpe-textures
          done

      - name: Extract non-BPE resources and validated DDS texture candidates
        if: always()
        run: |
          mkdir -p analysis-output/texture-resources
          for file in analysis-output/decompressed/*.decompressed.bin; do
            [ -f "$file" ] || continue
            python tools/extract_texture_resources.py "$file" --output-dir analysis-output/texture-resources
          done

      - name: Build visual audit of recovered DDS candidates
        if: always()
        run: |
          python -m pip install --disable-pip-version-check Pillow
          mkdir -p analysis-output/texture-audit
          for file in analysis-output/bpe-textures/*.dds; do
            [ -f "$file" ] || continue
            cp "$file" analysis-output/texture-audit/
          done
          python tools/build_dds_contact_sheet.py analysis-output/texture-audit --output-dir analysis-output/texture-audit

      - name: Decode BPE resources and export JBOY static meshes
        if: always()
        run: |
          mkdir -p analysis-output/extracted-models
          for file in analysis-output/decompressed/*.decompressed.bin; do
            [ -f "$file" ] || continue
            python tools/extract_jboy_models.py "$file" --output-dir analysis-output/extracted-models
          done

      - name: Audit JBOY material slots and UV links (read-only)
        if: always()
        run: |
          mkdir -p analysis-output/material-audit
          found=0
          for file in analysis-output/extracted-models/*_JBOY.bin; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _JBOY.bin)"
            python tools/audit_jboy_material_links.py "$file" --dds-dir analysis-output/texture-audit --output "analysis-output/material-audit/$name-material-audit.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No JBOY files available for material-slot audit." | tee analysis-output/material-audit/NO-JBOY-INPUT.txt
          fi

      - name: Validate candidate bone hierarchy in model summaries
        if: always()
        run: |
          mkdir -p analysis-output/bone-hierarchy
          found=0
          for file in analysis-output/extracted-models/*_summary.json; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _summary.json)"
            python tools/validate_jboy_bone_hierarchy.py "$file" --output "analysis-output/bone-hierarchy/$name-hierarchy.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No model summaries were available for hierarchy validation." | tee analysis-output/bone-hierarchy/NO-SUMMARIES.txt
          fi

      - name: Inspect raw candidate bone fields
        if: always()
        run: |
          mkdir -p analysis-output/bone-fields
          found=0
          for file in analysis-output/extracted-models/*_JBOY.bin; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _JBOY.bin)"
            python tools/inspect_jboy_bone_fields.py "$file" --output "analysis-output/bone-fields/$name-bone-fields.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No decoded JBOY files available for raw bone-field inspection." | tee analysis-output/bone-fields/NO-JBOY-INPUT.txt
          fi

      - name: Build heuristic bone-name map from model summaries
        if: always()
        run: |
          mkdir -p analysis-output/bone-map
          found=0
          for file in analysis-output/extracted-models/*_summary.json; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _summary.json)"
            python tools/map_jboy_bones.py "$file" --output "analysis-output/bone-map/$name-bone-map.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No model summaries available for heuristic bone mapping." | tee analysis-output/bone-map/NO-SUMMARIES.txt
          fi

      - name: Diagnose candidate bone transform fields
        if: always()
        run: |
          mkdir -p analysis-output/bone-transform-diagnostics
          found=0
          for file in analysis-output/extracted-models/*_summary.json; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _summary.json)"
            python tools/bone_transform_diagnostics.py "$file" --output "analysis-output/bone-transform-diagnostics/$name-transform-diagnostics.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No model summaries available for candidate transform diagnostics." | tee analysis-output/bone-transform-diagnostics/NO-SUMMARIES.txt
          fi

      - name: Validate JBOY skin-weight buffer spans
        if: always()
        run: |
          mkdir -p analysis-output/skinning
          found=0
          for file in analysis-output/extracted-models/*_JBOY.bin; do
            [ -f "$file" ] || continue
            found=1
            name="$(basename "$file" _JBOY.bin)"
            python tools/analyze_jboy_skinning.py "$file" --samples 5 --output "analysis-output/skinning/$name-skinning.json"
          done
          if [ "$found" -eq 0 ]; then
            echo "No decoded JBOY files were available for skin-weight validation." | tee analysis-output/skinning/NO-JBOY-INPUT.txt
          fi

      - name: Install pinned Blender 4.2.0 for rigged FBX export
        if: always()
        run: |
          BLENDER_ARCHIVE="/tmp/blender-4.2.0-windows-x64.zip"
          BLENDER_DIR="/tmp/blender-4.2.0-windows-x64"
          curl -L --fail --retry 3 "https://download.blender.org/release/Blender4.2/blender-4.2.0-windows-x64.zip" -o "$BLENDER_ARCHIVE"
          unzip -q "$BLENDER_ARCHIVE" -d /tmp
          BLENDER="$BLENDER_DIR/blender.exe"
          test -f "$BLENDER" || { echo "Pinned Blender 4.2.0 executable not found"; exit 1; }
          "$BLENDER" --version | head -n 3
          echo "$BLENDER" > /tmp/blender-path.txt

      - name: Export both SHDC body variants to rigged FBX
        if: always()
        run: |
          BLENDER="$(cat /tmp/blender-path.txt)"
          mkdir -p analysis-output/fbx
          found=0
          exported=0
          REPORT="analysis-output/fbx/body-export-report.txt"
          : > "$REPORT"
          for file in analysis-output/extracted-models/*_SHDC[01]_entry0_0_JBOY.bin; do
            [ -f "$file" ] || continue
            found=$((found + 1))
            name="$(basename "$file" _JBOY.bin)"
            echo "=== $name ===" | tee -a "$REPORT"
            set +e
            "$BLENDER" --background --python tools/blender_export_jboy_fbx.py -- "$file" "analysis-output/fbx/$name.fbx" >> "$REPORT" 2>&1
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [ -s "analysis-output/fbx/$name.fbx" ]; then
              exported=$((exported + 1))
              echo "STATUS=EXPORTED_FBX" | tee -a "$REPORT"
            else
              rm -f "analysis-output/fbx/$name.fbx"
              echo "STATUS=FAILED exit_code=$RC; continue with remaining body variants" | tee -a "$REPORT"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No SHDC0/SHDC1 main body JBOY inputs were available for FBX export." >&2
            exit 1
          fi
          if [ "$exported" -eq 0 ]; then
            echo "No main body FBX exports succeeded." >&2
            exit 1
          fi
          echo "Body candidates=$found; successful FBX exports=$exported" | tee -a "$REPORT"
          ls -lh analysis-output/fbx


      - name: Export accessory and clothing JBOY candidates
        if: always()
        run: |
          BLENDER="$(cat /tmp/blender-path.txt)"
          mkdir -p analysis-output/fbx-accessories
          REPORT="analysis-output/fbx-accessories/export-report.txt"
          : > "$REPORT"
          found=0
          exported=0
          for file in analysis-output/extracted-models/*_JBOY.bin; do
            [ -f "$file" ] || continue
            case "$file" in
              *_SHDC0_entry0_0_JBOY.bin|*_SHDC1_entry0_0_JBOY.bin) continue ;;
            esac
            found=$((found + 1))
            name="$(basename "$file" _JBOY.bin)"
            echo "=== $name ===" | tee -a "$REPORT"
            set +e
            "$BLENDER" --background --python tools/blender_export_jboy_fbx.py -- "$file" "analysis-output/fbx-accessories/$name.fbx" >> "$REPORT" 2>&1
            RC=$?
            set -e
            if [ "$RC" -eq 0 ] && [ -s "analysis-output/fbx-accessories/$name.fbx" ]; then
              exported=$((exported + 1))
              echo "STATUS=EXPORTED_FBX" | tee -a "$REPORT"
            else
              rm -f "analysis-output/fbx-accessories/$name.fbx"
              echo "STATUS=NOT_EXPORTED exit_code=$RC (inspect log; may be unskinned or incompatible)" | tee -a "$REPORT"
            fi
          done
          {
            echo "Accessory JBOY candidates found: $found"
            echo "Accessory FBX files exported: $exported"
            echo "These are separate candidate FBXs, not yet merged into the body skeleton."
            echo "Texture extraction and material assignment are not claimed by this step."
          } | tee -a "$REPORT"

      - name: Merge only matching wrestler and SHDC variant accessories
        if: always()
        run: |
          BLENDER="$(cat /tmp/blender-path.txt)"
          mkdir -p analysis-output/fbx-combined
          shopt -s nullglob
          for body in analysis-output/fbx/*.fbx; do
            [ -f "$body" ] || continue
            name="$(basename "$body" .fbx)"
            wrestler="${name%%_SHDC*}"
            variant="$(echo "$name" | sed -n 's/.*_SHDC\([01]\)_.*/\1/p')"
            [ -n "$variant" ] || { echo "Cannot identify SHDC variant from $name" >&2; exit 1; }
            accessories=(analysis-output/fbx-accessories/"${wrestler}_SHDC${variant}"_*.fbx)
            args=()
            for accessory in "${accessories[@]}"; do args+=("$accessory"); done
            echo "Merging ${#args[@]} matching accessories into $name"
            "$BLENDER" --background --python tools/merge_accessory_fbx.py -- "$body" "analysis-output/fbx-combined/$name-complete.fbx" "${args[@]}"
            test -s "analysis-output/fbx-combined/$name-complete.fbx" || { echo "Combined FBX missing or empty: $name" >&2; exit 1; }
          done
          ls -lh analysis-output/fbx-combined


      - name: Render FBX visual previews for inspection
        if: always()
        run: |
          BLENDER="$(cat /tmp/blender-path.txt)"
          mkdir -p analysis-output/previews
          for f in analysis-output/fbx-combined/*-complete.fbx; do
            [ -f "$f" ] || continue
            out="analysis-output/previews/$(basename "$f" .fbx).png"
            "$BLENDER" --background --python-expr '
import bpy, sys, math
from mathutils import Vector
fbx=sys.argv[-2]; out=sys.argv[-1]
bpy.ops.wm.read_factory_settings(use_empty=True)
bpy.ops.import_scene.fbx(filepath=fbx)
meshes=[o for o in bpy.context.scene.objects if o.type=="MESH"]
if not meshes: raise RuntimeError("FBX contains no mesh objects")
# Apply neutral material only when FBX has no material; keep imported materials otherwise.
for o in meshes:
 if not o.data.materials:
  m=bpy.data.materials.new("Preview_Neutral"); m.diffuse_color=(0.55,0.55,0.58,1); o.data.materials.append(m)
pts=[Vector(corner) for o in meshes for corner in (o.matrix_world @ Vector(v) for v in o.bound_box)]
lo=Vector((min(p.x for p in pts),min(p.y for p in pts),min(p.z for p in pts))); hi=Vector((max(p.x for p in pts),max(p.y for p in pts),max(p.z for p in pts)))
center=(lo+hi)/2; size=max(hi-lo); size=max(size,0.1)
camdata=bpy.data.cameras.new("PreviewCamera"); cam=bpy.data.objects.new("PreviewCamera",camdata); bpy.context.scene.collection.objects.link(cam)
cam.location=center+Vector((size*2.6,-size*3.5,size*1.4)); direction=center-cam.location; cam.rotation_euler=direction.to_track_quat("-Z","Y").to_euler(); camdata.type="ORTHO"; camdata.ortho_scale=size*1.45; bpy.context.scene.camera=cam
for loc,power,size_l in [(center+Vector((size*2,-size*2,size*3)),1800,size*2),(center+Vector((-size*2,-size,size*1.5)),1100,size*2)]:
 ld=bpy.data.lights.new("PreviewLight","AREA"); loobj=bpy.data.objects.new("PreviewLight",ld); bpy.context.scene.collection.objects.link(loobj); loobj.location=loc; ld.energy=power; ld.shape="DISK"; ld.size=size_l; loobj.rotation_euler=(center-loobj.location).to_track_quat("-Z","Y").to_euler()
scene=bpy.context.scene; scene.render.engine="BLENDER_EEVEE_NEXT"; scene.render.resolution_x=768; scene.render.resolution_y=1024; scene.render.resolution_percentage=100; scene.render.image_settings.file_format="PNG"; scene.render.filepath=out; scene.world.color=(0.08,0.08,0.08)
bpy.ops.render.render(write_still=True)
' -- "$f" "$out"
          done
          ls -lh analysis-output/previews
      - name: Run read-only PAC probe and exploratory analyzer
        env:
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          mkdir -p analysis-output
          while IFS= read -r PAC_FILE; do
            {
              echo "=================================================="
              echo "ANALYZING: $PAC_FILE"
              echo "=================================================="
              python tools/pac_probe.py "$PAC_FILE"
              echo
              python tools/pac_analyze.py "$PAC_FILE"
              echo
            } | tee -a analysis-output/pac-report.txt
          done < analysis-targets.txt

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch120-ch139-pac-comparison
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
