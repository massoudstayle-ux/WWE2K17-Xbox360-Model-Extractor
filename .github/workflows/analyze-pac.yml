name: Analyze WWE 2K17 PAC

on:
  push:
    paths:
      - 'ch120.pac'
      - 'ch139.pac'
      - 'tools/pac_probe.py'
      - 'tools/pac_analyze.py'
      - 'tools/inspect_xcompress.py'
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/analyze-pac.yml'
  workflow_dispatch:
    inputs:
      target_file:
        description: "PAC file in the repository"
        required: true
        default: "ch139.pac"
        type: string

permissions:
  contents: read

jobs:
  pac-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify input file
        env:
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          if [ -n "$TARGET_FILE" ]; then
            test -f "$TARGET_FILE" || { echo "PAC file not found: $TARGET_FILE"; exit 1; }
            echo "$TARGET_FILE" > analysis-targets.txt
          else
            : > analysis-targets.txt
            for file in ch120.pac ch139.pac; do
              if [ -f "$file" ]; then echo "$file" >> analysis-targets.txt; fi
            done
          fi
          test -s analysis-targets.txt || { echo "No target PAC files found"; exit 1; }
          while IFS= read -r file; do ls -lh "$file"; done < analysis-targets.txt

      - name: Install QuickBMS and official XCompress script
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libc6-i386
          mkdir -p .quickbms analysis-output/decompressed
          curl -fL --retry 3 https://mirror.aluigi.org/papers/quickbms_linux.zip -o /tmp/quickbms_linux.zip
          curl -fL --retry 3 https://mirror.aluigi.org/quickbms_scripts.zip -o /tmp/quickbms_scripts.zip
          unzip -q /tmp/quickbms_linux.zip -d .quickbms
          unzip -q /tmp/quickbms_scripts.zip -d .quickbms/scripts
          QUICKBMS="$(find .quickbms -type f \( -name quickbms -o -name quickbms_4gb_files \) | head -n 1)"
          XCOMPRESS_SCRIPT="$(find .quickbms/scripts -type f -iname xcompress_file.bms | head -n 1)"
          test -n "$QUICKBMS" || { echo "QuickBMS executable not found in official archive"; exit 1; }
          test -n "$XCOMPRESS_SCRIPT" || { echo "xcompress_file.bms not found in official script archive"; exit 1; }
          chmod +x "$QUICKBMS"
          echo "$QUICKBMS" > .quickbms/executable-path.txt
          echo "$XCOMPRESS_SCRIPT" > .quickbms/xcompress-script-path.txt
          "$QUICKBMS" -h | head -n 8 || true

      - name: Attempt XCompress LZXTDECODE decompression
        run: |
          QUICKBMS="$(cat .quickbms/executable-path.txt)"
          XCOMPRESS_SCRIPT="$(cat .quickbms/xcompress-script-path.txt)"
          while IFS= read -r PAC_FILE; do
            MAGIC="$(od -An -tx1 -N4 "$PAC_FILE" | tr -d ' \n')"
            OUT="analysis-output/decompressed/$(basename "$PAC_FILE" .pac)"
            mkdir -p "$OUT"
            echo "=== $PAC_FILE magic=$MAGIC ===" | tee -a analysis-output/xcompress-report.txt
            if [ "$MAGIC" = "0ff512ed" ]; then
              set +e
              timeout 180 "$QUICKBMS" -o "$XCOMPRESS_SCRIPT" "$PAC_FILE" "$OUT" 2>&1 | tee -a analysis-output/xcompress-report.txt
              RC=${PIPESTATUS[0]}
              set -e
              echo "QuickBMS exit code: $RC" | tee -a analysis-output/xcompress-report.txt
              find "$OUT" -type f -printf '%p %s bytes\n' | tee -a analysis-output/xcompress-report.txt
            else
              echo "Skipped: input does not have LZXTDECODE magic" | tee -a analysis-output/xcompress-report.txt
            fi
          done < analysis-targets.txt
          python - <<'PY'
          from pathlib import Path
          for p in sorted(Path("analysis-output/decompressed").rglob("*")):
              if p.is_file():
                  with p.open("rb") as f:
                      head = f.read(32)
                  print(f"{p}: size={p.stat().st_size}, first32={head.hex(' ').upper()}")
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run read-only PAC probe and exploratory analyzer
        env:
          TARGET_FILE: ${{ inputs.target_file }}
        run: |
          mkdir -p analysis-output
          while IFS= read -r PAC_FILE; do
            {
              echo "=================================================="
              echo "ANALYZING: $PAC_FILE"
              echo "=================================================="
              python tools/pac_probe.py "$PAC_FILE"
              echo
              python tools/pac_analyze.py "$PAC_FILE"
              echo
            } | tee -a analysis-output/pac-report.txt
          done < analysis-targets.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: ch120-ch139-pac-comparison
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
