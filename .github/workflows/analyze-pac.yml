name: Analyze WWE 2K17 PAC

on:
  push:
    paths:
      - 'ch139.pac'
      - 'tools/pac_probe.py'
      - '.github/workflows/analyze-pac.yml'
  workflow_dispatch:
    inputs:
      target_file:
        description: "PAC file in the repository"
        required: true
        default: "ch139.pac"
        type: string

permissions:
  contents: read

jobs:
  pac-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify input file
        env:
          PAC_FILE: ${{ inputs.target_file || 'ch139.pac' }}
        run: |
          test -f "$PAC_FILE" || {
            echo "PAC file not found: $PAC_FILE"
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          }
          ls -lh "$PAC_FILE"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run read-only PAC probe and exploratory analyzer
        env:
          PAC_FILE: ${{ inputs.target_file || 'ch139.pac' }}
        run: |
          mkdir -p analysis-output
          {
            python tools/pac_probe.py "$PAC_FILE"
            echo
            python tools/pac_analyze.py "$PAC_FILE"
          } | tee analysis-output/pac-report.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: ch139-pac-analysis
          path: analysis-output/pac-report.txt
          if-no-files-found: error
          retention-days: 14
